spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
    name: prediction_market
  
  # Tests run without Redis. MarketReadCache + MarketCacheInvalidator + RedisConfig
  # are all @ConditionalOnProperty("spring.data.redis.url"); omitting the property
  # entirely (rather than setting it to empty) leaves the condition unmatched and
  # MarketService falls through to Postgres for every read.
  # See docs/adr/0005-redis-read-cache-cache-aside-delete-after-commit.md.
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "dummy-client-id"
            client-secret: "dummy-client-secret"
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/auth/google/callback"

  jpa:
    hibernate:
      ddl-auto: none # We use flyway
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        default_schema: market

  flyway:
    enabled: true
    schemas: market
    default-schema: market
    create-schemas: true
    clean-disabled: false

app:
  jwt-secret: "test_secret_key_which_is_at_least_32_bytes_long"
  jwt-expiry-ms: 900000 
  jwt-refresh-expiry-day: 30
  analytics:
    posthog:
      enabled: false
      api-key: ""
      host: "https://eu.i.posthog.com"

ratelimit:
  window-seconds: 60
  trade:
    max: 30
  sse-connect:
    max: 20
  fail-closed: true

# Settlement worker is disabled in tests so the @Scheduled poller doesn't fire
# against the H2 in-memory DB during integration tests. Tests that exercise the
# worker should @TestPropertySource it back on. See
# docs/adr/0002-async-settlement-via-postgres-queue.md.
settlement:
  worker:
    enabled: false
