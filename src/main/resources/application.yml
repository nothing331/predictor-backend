spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
---
# Development Profile (Docker)
spring:
  config:
    activate:
      on-profile: dev | demo

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:prediction_market}
    username: ${POSTGRES_USER:market_user}
    password: ${POSTGRES_PASSWORD:dev_password_123}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      url: ${REDIS_URL}

  flyway:
    enabled: true
    schemas: market
    default-schema: market
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate # Only validate, don't auto-create (we use init scripts)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: market

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/auth/google/callback"

app:
  demo:
    auth:
      enabled: false
  jwt-secret: ${JWT_SECRET}
  jwt-expiry-ms: 900000 
  jwt-refresh-expiry-day: 30
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  analytics:
    posthog:
      enabled: ${POSTHOG_ENABLED:false}
      api-key: ${POSTHOG_API_KEY:}
      host: ${POSTHOG_HOST:https://us.i.posthog.com}

ratelimit:
  window-seconds: 60
  trade:
    max: 30
  sse-connect:
    max: 20
  fail-closed: false
